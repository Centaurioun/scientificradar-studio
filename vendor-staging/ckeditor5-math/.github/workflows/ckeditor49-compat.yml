name: CKEditor 49 compatibility
on:
  push:
    branches:
      - 'upgrade/**'
  pull_request:
    branches:
      - master
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node: ['22','24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install exactly locked CKEditor 49 dependency graph
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Bundle plugin with real CKEditor imports
        run: npm run build:smoke
      - name: Build TypeScript declarations
        run: npm run build
      - name: Install Chromium for functional smoke (Node 22)
        if: matrix.node == '22'
        run: npx playwright install --with-deps chromium
      - name: Run real editor browser smoke (Node 22)
        if: matrix.node == '22'
        run: npm run test:browser
      - name: Guard against legacy CKEditor import paths
        run: |
          if grep -RE "(ckeditor5/src/|@ckeditor/ckeditor5-[a-z-]+/src/)" src --include='*.ts'; then
            echo 'Legacy CKEditor import path found'; exit 1
          fi
