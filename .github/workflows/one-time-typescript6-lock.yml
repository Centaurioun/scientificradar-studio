# TEMPORARY experimental branch-only dependency lock refresh; delete when complete.
name: ONE-TIME TS6 lock refresh on experiment
on:
  push:
    branches: [experiment/dependency-upgrade-2026-11-01]
permissions:
  contents: read
jobs:
  lock:
    if: github.repository == 'Centaurioun/scientificradar-studio' && github.ref == 'refs/heads/experiment/dependency-upgrade-2026-11-01'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: experiment/dependency-upgrade-2026-11-01
          persist-credentials: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26.13.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - name: Generate frozen-compatible lock for supported TypeScript
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "experiment/dependency-upgrade-2026-11-01"
          bun install --lockfile-only
          bun install --frozen-lockfile
      - name: Commit only the regenerated Bun lockfile
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "experiment/dependency-upgrade-2026-11-01"
          git add -- bun.lock
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(experiment): lock TypeScript 6.0.3 compatibility fallback'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
