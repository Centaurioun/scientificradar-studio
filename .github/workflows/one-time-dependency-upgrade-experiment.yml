# Isolated, ONE-TIME experiment. Delete after it has generated the Bun lockfile.
# Never run against main or production; do not merge this workflow.
name: ONE-TIME isolated Bun dependency upgrade
on:
  push:
    branches:
      - experiment/dependency-upgrade-2026-11-01
permissions:
  contents: read
jobs:
  upgrade-only-on-experiment:
    if: github.repository == 'Centaurioun/scientificradar-studio' && github.ref == 'refs/heads/experiment/dependency-upgrade-2026-11-01'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Check out the isolated branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: experiment/dependency-upgrade-2026-11-01
          persist-credentials: true
      - name: Set up Node 26
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
      - name: Set up Bun 1.4.0
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Upgrade direct dependencies to latest stable and regenerate Bun lock
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "experiment/dependency-upgrade-2026-11-01"
          bun update --latest
          bun install --frozen-lockfile
          echo 'DEPENDENCY_DIFF_START'
          git diff -- package.json
          echo 'DEPENDENCY_DIFF_END'
      - name: Commit only the dependency manifest and lockfile
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "experiment/dependency-upgrade-2026-11-01"
          git add -- package.json bun.lock
          if git diff --cached --quiet; then
            echo 'No dependency changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'experiment: upgrade stable dependencies and refresh Bun lock'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
