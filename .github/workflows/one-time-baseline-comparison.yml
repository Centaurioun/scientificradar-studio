# One-time, read-only baseline comparison. Do NOT merge this workflow.
name: ONE-TIME baseline scientific editor E2E comparison
on:
  push:
    branches: [experiment/dependency-upgrade-2026-11-01]
permissions:
  contents: read
jobs:
  baseline:
    if: github.repository == 'Centaurioun/scientificradar-studio' && github.ref == 'refs/heads/experiment/dependency-upgrade-2026-11-01'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Check out unmodified baseline snapshot (NOT experiment head)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 13b45bafb1d07f5a1ea3d9ae0cd10859907fea4c
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26.13.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - name: Resolve baseline lock mismatch without writing source or pushing
        run: |
          set -euo pipefail
          bun install
          echo 'BASLINE PACKAGE' && bun pm ls | head -60 || true
          echo 'Lock changes are ONLY inside this disposable runner'
      - name: Baseline unit and static diagnostics (nonblocking)
        run: |
          bun run test:unit
          bun run typecheck
          bun run lint
      - name: Build the original baseline application
        run: bun run build
      - name: Install Chromium
        run: bun run test:e2e:install:ci
      - name: Reproduce only the two failed scientific editor cases
        run: bun run test:e2e --grep 'S-ED-1|S-MATH-1'
      - name: Upload failing E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: baseline-editor-e2e-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
