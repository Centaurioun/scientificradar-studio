# ONE-TIME, branch-specific source snapshot. NEVER merge this workflow to main.
name: TEMP stage CKEditor 5 core and Math source
on:
  push:
    branches: [staging/ckeditor5-source-snapshots-2026-11-02]
permissions:
  contents: read
jobs:
  stage:
    if: github.repository == 'Centaurioun/scientificradar-studio' && github.ref == 'refs/heads/staging/ckeditor5-source-snapshots-2026-11-02'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging/ckeditor5-source-snapshots-2026-11-02
          path: studio
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: Centaurioun/ckeditor5
          ref: fc80e6091c1df4753fbbc82888bafdc6a4871f62
          path: ckeditor-core-ref
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: Centaurioun/ckeditor5-math
          ref: 6d8a39a181d1a0b233b8676eb47847c9b506ef53
          path: ckeditor-math-ref
          persist-credentials: false
          fetch-depth: 1
      - name: Safely stage only relevant original tracked source and all Math source/tests
        shell: bash
        run: |
          set -euo pipefail
          cd studio
          test "$(git branch --show-current)" = "staging/ckeditor5-source-snapshots-2026-11-02"
          test "$(git -C ../ckeditor-core-ref rev-parse HEAD)" = "fc80e6091c1df4753fbbc82888bafdc6a4871f62"
          test "$(git -C ../ckeditor-math-ref rev-parse HEAD)" = "6d8a39a181d1a0b233b8676eb47847c9b506ef53"
          mkdir -p vendor-staging/ckeditor5/packages vendor-staging/ckeditor5-math
          rsync -a --prune-empty-dirs \
            --include='*/' --include='*.ts' --include='*.tsx' --include='*.js' \
            --include='*.mjs' --include='*.cjs' --include='*.css' --include='*.scss' \
            --include='*.svg' --include='*.json' --include='*.md' \
            --include='*.html' --include='*.yml' --include='*.yaml' \
            --include='*.xml' --include='*.txt' --exclude='*' \
            ../ckeditor-core-ref/packages/ vendor-staging/ckeditor5/packages/
          for f in package.json pnpm-lock.yaml pnpm-workspace.yaml COPYING.GPL LICENSE.md README.md tsconfig.json tsconfig.build.json; do
            cp "../ckeditor-core-ref/$f" vendor-staging/ckeditor5/
          done
          for d in typings scripts; do cp -a "../ckeditor-core-ref/$d" "vendor-staging/ckeditor5/$d"; done
          rsync -a --exclude='.git' --exclude='node_modules' --exclude='dist' --exclude='coverage' \
            ../ckeditor-math-ref/ vendor-staging/ckeditor5-math/
          test -f vendor-staging/ckeditor5/COPYING.GPL
          test -f vendor-staging/ckeditor5-math/LICENSE
          test -f vendor-staging/ckeditor5-math/UPGRADE_49.md
          test -f vendor-staging/ckeditor5/packages/ckeditor5-engine/src/model/model.ts
          test -f vendor-staging/ckeditor5/packages/ckeditor5-table/package.json
          test -f vendor-staging/ckeditor5-math/src/math.ts
          n=$(find vendor-staging/ckeditor5/packages -mindepth 1 -maxdepth 1 -type d | wc -l)
          test "$n" -eq 60
          count=$(find vendor-staging -type f | wc -l)
          echo "Staging files: $count, packages: $n"
          du -sh vendor-staging/ckeditor5 vendor-staging/ckeditor5-math
          test "$count" -ge 7700
          # GitHub & AI Studio safety guard: no accidental oversized snapshot.
          kb=$(du -sk vendor-staging | cut -f1)
          test "$kb" -lt 100000
      - name: Commit only the two pinned inactive source directories
        working-directory: studio
        shell: bash
        run: |
          set -euo pipefail
          git add -- vendor-staging/ckeditor5 vendor-staging/ckeditor5-math
          if git diff --cached --quiet; then echo 'No change'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'vendor(staging): pin CKEditor 49 core and Math fork reference source'
          git push origin "HEAD:refs/heads/staging/ckeditor5-source-snapshots-2026-11-02"
